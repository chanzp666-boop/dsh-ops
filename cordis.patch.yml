# One row, named exactly like the package: dsh-client-modules mounts a package's
# browser half on the row whose specifier is the package name, so this row also
# carries the Plugins-page configuration for every feature.
#
# macOS port (see docs/MACOS-PORT.md): starts with the Standard resident file
# tools only. hideOfficialTools stays false so the official read/glob/grep remain
# available until ops_* publication is observed; bash, ptc, cordis, discovery,
# panel and tui stay off for the first verification round.
- insert:
    - id: dsh-ops
      name: dsh-ops
      config:
        global:
          bash: false
          hidePwsh: false
          hideOfficialTools: false
          dynamicTools: false
        minimal:
          enabled: false
        standard:
          enabled: true
          residentTools: true
        ptc:
          enabled: false
          residentTools: false
        cordis:
          enabled: false
          residentTools: false
        discovery:
          enabled: false
        panel:
          enabled: false
        tui:
          enabled: false
